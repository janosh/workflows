name: GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        description: NodeJS version
        type: string
        default: "24"
      pre-build:
        description: Command to run before building
        type: string
        default: ""
      post-build:
        description: Command to run after building
        type: string
        default: ""
      working-directory:
        description: Working directory
        type: string
        default: "."
      python-version:
        description: Python version (setup-python is skipped when empty)
        type: string
        default: ""
      install-cmd:
        description: Command to install dependencies
        type: string
        default: npm install
      build-cmd:
        description: Command that builds the static site
        type: string
        default: npm run build
      build-dir:
        description: Build output directory to publish, relative to working-directory
        type: string
        default: build

# set permissions of GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/package.json

      - name: Set up python
        uses: actions/setup-python@v7
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          ${{ inputs.install-cmd }}

      - name: Build site
        run: |
          ${{ inputs.pre-build }}
          ${{ inputs.build-cmd }}
          ${{ inputs.post-build }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.build-dir }}

  deploy:
    # Pages has one live site: PR runs (incl. pull_request_target, merge_group) and runs on other
    # branches only build to verify. Callers see their own event_name and ref here.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
