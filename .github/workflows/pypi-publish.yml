name: Publish to PyPI

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest
      python-version:
        description: Python version
        type: string
        default: "3.12"
      uv-version:
        description: uv version
        type: string
        default: latest

# PyPI trusted publishing doesn't support reusable workflows yet (https://github.com/pypi/warehouse/issues/11096),
# so callers pass a PyPI API token as the PYPI_TOKEN secret (`secrets: inherit` or explicitly).

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}

      - name: Build and publish package to PyPI
        run: |
          uv build
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
