name: Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        default: "3.12"
      os:
        description: Operating system
        type: string
        default: ubuntu-latest
      node-version:
        description: Node.js version (setup-node is skipped when empty)
        type: string
        default: ""
      pre-install-cmd:
        description: Command to run before installing dependencies
        type: string
        default: ""
      install-cmd:
        description: Command to install dependencies
        type: string
        default: uv pip install -e '.[test]' --system
      test-cmd:
        description: Command to run tests (must write coverage.xml when upload-coverage is not 'no')
        type: string
        default: pytest --durations 20 --cov . --cov-report=xml
      pre-test-cmd:
        description: Command to run before tests
        type: string
        default: ""
      upload-coverage:
        description: Upload coverage.xml to Codecov. One of 'no', 'yes' or 'strict' (fail the job on upload errors)
        type: string
        default: "no"

jobs:
  tests:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Validate inputs
        if: ${{ !contains(fromJSON('["no", "yes", "strict"]'), inputs.upload-coverage) }}
        run: |
          echo "::error::upload-coverage must be 'no', 'yes' or 'strict', got '${{ inputs.upload-coverage }}'"
          exit 1

      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        shell: bash
        run: |
          ${{ inputs.pre-install-cmd }}
          ${{ inputs.install-cmd }}

      - name: Run tests
        run: |
          ${{ inputs.pre-test-cmd }}
          ${{ inputs.test-cmd }}

      - name: Upload coverage to Codecov
        if: inputs.upload-coverage != 'no'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ inputs.upload-coverage == 'strict' }}
