name: Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version, or a JSON list of versions to test against, e.g. '["3.12", "3.13"]'
        type: string
        default: "3.12"
      runs-on:
        description: Runner label, or a JSON list of labels to test on, e.g. '["ubuntu-latest", "windows-latest"]'
        type: string
        default: ubuntu-latest
      node-version:
        description: Node.js version (setup-node is skipped when empty)
        type: string
        default: ""
      pre-install-cmd:
        description: Command to run before installing dependencies
        type: string
        default: ""
      install-cmd:
        description: Command to install dependencies
        type: string
        default: uv pip install -e '.[test]' --system
      pre-test-cmd:
        description: Command to run before tests
        type: string
        default: ""
      test-cmd:
        description: Command to run tests (must write coverage.xml when upload-coverage is not 'no')
        type: string
        default: pytest --durations 20 --cov . --cov-report=xml
      upload-coverage:
        description: Upload coverage.xml to Codecov. One of 'no', 'yes' or 'strict' (fail the job on upload errors)
        type: string
        default: "no"

permissions:
  contents: read

jobs:
  tests:
    # keep the plain `tests` name for single-value callers so required status checks don't change
    name: ${{ (startsWith(inputs.python-version, '[') || startsWith(inputs.runs-on, '[')) && format('tests ({0}, {1})', matrix.python-version, matrix.runs-on) || 'tests' }}
    strategy:
      fail-fast: false
      matrix:
        # a plain value becomes a one-element list, so callers can pass either form
        python-version: ${{ fromJSON(startsWith(inputs.python-version, '[') && inputs.python-version || format('["{0}"]', inputs.python-version)) }}
        runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || format('["{0}"]', inputs.runs-on)) }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Validate inputs
        if: ${{ !contains(fromJSON('["no", "yes", "strict"]'), inputs.upload-coverage) }}
        run: |
          echo "::error::upload-coverage must be 'no', 'yes' or 'strict', got '${{ inputs.upload-coverage }}'"
          exit 1

      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        shell: bash
        run: |
          ${{ inputs.pre-install-cmd }}
          ${{ inputs.install-cmd }}

      - name: Run tests
        run: |
          ${{ inputs.pre-test-cmd }}
          ${{ inputs.test-cmd }}

      - name: Upload coverage to Codecov
        if: inputs.upload-coverage != 'no'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ inputs.upload-coverage == 'strict' }}
